name: Build GPU tools worker image

# The GPU tools worker (gputools/): FlashVSR v1.1 (clips under 720 lines -> 1080), RIFE 4.25 (real 60 fps) and
# ACE-Step 1.5 (a music bed per video) on one RunPod serverless GPU endpoint, "thumbgenius-gpu-tools"; the video
# worker's client is runpod/src/gputools.py. Builds when gputools/ changes on feature/gpu-tools (like the TTS
# image on its branch; a manual-only workflow is not even listed until the file is on main), or by hand. Nothing
# is deployed: tags go into the same public GHCR package as the video worker, prefixed "gputools-", so RunPod pulls
# them without registry credentials: ghcr.io/<owner>/thumbgenius-video-worker:gputools-<commit sha>.

on:
  push:
    branches: [feature/gpu-tools]
    paths:
      - "gputools/**"
      - ".github/workflows/build-gputools.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/thumbgenius-video-worker

jobs:
  build:
    runs-on: ubuntu-latest
    # Block-Sparse-Attention compiles from source (forward kernels, sm_80: ~20-40 min on 4 cores), then ~14 GB of
    # weights are baked in.
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space (the CUDA build stage + a ~25 GB image)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/share/powershell /usr/share/swift /opt/microsoft \
            /opt/hostedtoolcache /usr/local/.ghcup /usr/lib/jvm || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        run: echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./gputools
          file: ./gputools/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:gputools-latest
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:gputools-${{ github.sha }}
          # Layer cache from the last GPU tools image (inline), not the shared GHA cache: ~14 GB of weights
          # would push the video worker's cache out.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:gputools-latest
          cache-to: type=inline

      - name: Summary
        run: |
          echo "### GPU tools image built" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:gputools-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          df -h / >> $GITHUB_STEP_SUMMARY
