name: Build video worker image

# Builds the RunPod worker image in CI, so no Docker is needed locally.
# The resulting image is pushed to GHCR and can be pointed at from a RunPod
# serverless template.

on:
  push:
    branches: [thumbgenius-video-worker]
    paths:
      - "runpod/**"
      - ".github/workflows/build-worker.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/thumbgenius-video-worker

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        run: echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./runpod
          file: ./runpod/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:${{ github.sha }}
          # Layer cache makes repeat builds minutes rather than tens of minutes;
          # the Remotion + Chrome layers are heavy.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Worker image built" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Point the RunPod template's image at that reference." >> $GITHUB_STEP_SUMMARY
          echo "If the package is private, make it public in GHCR settings or add registry auth in RunPod." >> $GITHUB_STEP_SUMMARY
